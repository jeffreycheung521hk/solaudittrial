# Copy this file to config.yaml. Keep credentials in .env or the process
# environment; never paste them directly into this file.
providers:
  - name: helius
    url: "https://mainnet.helius-rpc.com/?api-key=${HELIUS_KEY}"
    rps: 10
    archive: true
  - name: quicknode
    url: "${QUICKNODE_URL}"
    rps: 15
    archive: true
  - name: public
    url: "https://api.mainnet-beta.solana.com"
    rps: 2
    archive: false

range:
  mode: last_days
  last_days: 30
  # For a fixed range, use:
  # mode: explicit
  # start_slot: 340000000
  # end_slot: 340500000

sampling:
  content_check_slots: 2000
  seed: 42

limits:
  max_requests_per_provider: 200000
  tip_safety_margin_slots: 150  # enforced minimum; larger is allowed
