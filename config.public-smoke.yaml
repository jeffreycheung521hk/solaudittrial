# Small, reproducible Pass-A smoke run using two independent public endpoints.
# Public services are rate-limited and have no SLA; do not treat this as a
# substitute for the 30-day, multi-archive-provider experiment.
providers:
  - name: solana-public
    url: "https://api.mainnet.solana.com"
    rps: 1
    archive: false
  - name: publicnode
    url: "https://solana-rpc.publicnode.com"
    rps: 1
    archive: false

range:
  mode: last_days
  last_days: 0.01

sampling:
  content_check_slots: 0
  seed: 42

limits:
  max_requests_per_provider: 20
  tip_safety_margin_slots: 150

